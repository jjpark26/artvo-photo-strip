<!DOCTYPE html>
<html>
<head>
    <title>Photo Strip</title>
</head>

<body>

    <h1>Upload Photos</h1>

    <form method="POST" enctype="multipart/form-data">

        <p>Photo 1</p>
        <input type="file" name="photo1" required>

        <p>Photo 2</p>
        <input type="file" name="photo2" required>

        <p>Photo 3</p>
        <input type="file" name="photo3" required>

        <br><br>

        <label>Message</label><br>
        <input type="text" name="message" placeholder="Write your message"><br><br>

        <button type="submit">Create Photo Strip</button>

    </form>


</body>
</html>
